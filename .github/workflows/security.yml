name: Security Scan
on:
  pull_request: {}

env:
  GOCACHE: /cache/go-build
  GOMODCACHE: /cache/go-mod
  RUNNERFOUNDRY_POSTGRES_CACHE: /cache/runnerfoundry/embedded-postgres
  npm_config_cache: /cache/npm

jobs:
  osv:
    name: OSV Scan
    runs-on: meza-ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Build OSV Scanner
        env:
          GOBIN: ${{ runner.temp }}/osv-scanner-bin
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0

      - name: Run OSV Scan
        run: |
          "${RUNNER_TEMP}/osv-scanner-bin/osv-scanner" scan source --recursive --call-analysis=go -f gh-annotations .

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: osv-results
          path: 'osv-results.json'

  semgrep:
    name: Semgrep Scan
    runs-on: meza-ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep Scan
        run: |
          semgrep scan \
            --config p/default \
            --metrics off \
            --error \
            --strict \
            --scan-unknown-extensions \
            --verbose \
            --matching-explanations \
            --json-output semgrep-results.json \
            .

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-results
          path: 'semgrep-results.json'
