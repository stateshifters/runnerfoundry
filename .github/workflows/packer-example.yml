name: Verify Packer example

on:
  push:
    branches:
      - main
    paths:
      - examples/libvirt-runner/**
      - .github/workflows/packer-example.yml
  pull_request:
    paths:
      - examples/libvirt-runner/**
      - .github/workflows/packer-example.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: meza-ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: 1.15.4

      - name: Prepare build key
        run: ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/packer-key"

      - name: Initialize Packer
        run: packer init examples/libvirt-runner

      - name: Check Packer formatting
        run: packer fmt -check examples/libvirt-runner

      - name: Validate Packer template
        run: >-
          packer validate
          -var "ssh_private_key_file=$RUNNER_TEMP/packer-key"
          examples/libvirt-runner

      - name: Build image
        run: >-
          packer build
          -var "ssh_private_key_file=$RUNNER_TEMP/packer-key"
          examples/libvirt-runner
