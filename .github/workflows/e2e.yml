name: Product-contract E2E

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sqlite:
    name: SQLite (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: meza-ubuntu-slim
            prepare_postgres: false
          - platform: Windows
            runner: meza-windows-slim
            prepare_postgres: true

    env: &mixed-env
      RUNNERFOUNDRY_POSTGRES_CACHE: ${{ matrix.platform == 'Linux' && '/cache/runnerfoundry/embedded-postgres' || 'Z:\cache\runnerfoundry\embedded-postgres'}}
      npm_config_cache: ${{ matrix.platform == 'Linux' && '/cache/npm' || 'Z:\cache\npm' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Linux Go cache paths
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          echo 'GOCACHE=/cache/go-build' >> "$GITHUB_ENV"
          echo 'GOMODCACHE=/cache/go-mod' >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: ${{ matrix.platform != 'Windows' }}

      - name: Restore shared Windows Go cache
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: &restore-windows-go-cache |
          $ErrorActionPreference = 'Stop'
          $cacheRoot = Join-Path $env:RUNNER_TEMP 'go-cache'
          $cacheDirectory = 'Z:\cache'
          $archivePath = "$cacheDirectory\${{ hashFiles('go.mod') }}.zip"
          Remove-Item -LiteralPath $cacheRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $cacheRoot -Force | Out-Null
          try {
            if (-not (Test-Path -LiteralPath $cacheDirectory -PathType Container)) {
              Write-Warning "Shared Go cache directory is unavailable; using an empty cache."
            }
            elseif (Test-Path -LiteralPath $archivePath -PathType Leaf) {
              [System.IO.Compression.ZipFile]::ExtractToDirectory($archivePath, $cacheRoot)
            }
          }
          catch {
            Write-Warning "Shared Go cache restore failed; using an empty cache: $($_.Exception.Message)"
            Remove-Item -LiteralPath $cacheRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $cacheRoot -Force | Out-Null
          }
          "GOCACHE=$(Join-Path $cacheRoot 'go-build')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GOMODCACHE=$(Join-Path $cacheRoot 'go-mod')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache embedded PostgreSQL 18 binaries
        if: matrix.prepare_postgres
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/e2e/postgres/18.3.0
          key: embedded-postgres-v1.34.0-checksums-v1-${{ runner.os }}-${{ runner.arch }}-18.3.0

      - name: Exercise platform PostgreSQL preparation
        if: matrix.prepare_postgres
        run: make prepare-e2e E2E_POSTGRES_VERSION=18.3.0

      - name: Run SQLite E2E tests
        run: make test-e2e E2E_BACKEND=sqlite

      - name: Save shared Windows Go cache
        if: success() && matrix.platform == 'Windows'
        shell: pwsh
        run: &save-windows-go-cache |
          $ErrorActionPreference = 'Stop'
          $cacheDirectory = 'Z:\cache'
          $cacheHash = "${{ hashFiles('go.mod') }}"
          $archivePath = "$cacheDirectory\$cacheHash.zip"
          $cacheRoot = Join-Path $env:RUNNER_TEMP 'go-cache'
          $localArchive = $null
          $sharedTemporary = $null
          try {
            New-Item -ItemType Directory -Path $cacheDirectory -Force | Out-Null
            if (Test-Path -LiteralPath $archivePath -PathType Leaf) {
              Write-Host "Shared Go cache already exists for $cacheHash; skipping save."
              return
            }
            $identifier = [System.Guid]::NewGuid().ToString('N')
            $localArchive = Join-Path $env:RUNNER_TEMP "$cacheHash-$identifier.zip"
            $sharedTemporary = Join-Path $cacheDirectory ".$cacheHash-$identifier.tmp"
            [System.IO.Compression.ZipFile]::CreateFromDirectory($cacheRoot, $localArchive)
            Copy-Item -LiteralPath $localArchive -Destination $sharedTemporary
            try {
              [System.IO.File]::Move($sharedTemporary, $archivePath)
              Write-Host "Saved shared Go cache for $cacheHash."
            }
            catch [System.IO.IOException] {
              if (Test-Path -LiteralPath $archivePath -PathType Leaf) {
                Write-Host "Another runner saved the shared Go cache for $cacheHash."
              }
              else {
                throw
              }
            }
          }
          catch {
            Write-Warning "Shared Go cache save failed; the successful job result is unchanged: $($_.Exception.Message)"
          }
          finally {
            if ($null -ne $localArchive) {
              Remove-Item -LiteralPath $localArchive -Force -ErrorAction SilentlyContinue
            }
            if ($null -ne $sharedTemporary) {
              Remove-Item -LiteralPath $sharedTemporary -Force -ErrorAction SilentlyContinue
            }
          }

  tagged-static-analysis:
    name: Tagged E2E static analysis
    runs-on: meza-ubuntu-slim
    timeout-minutes: 15
    env: &ubuntu-env
      GOCACHE: /cache/go-build
      GOMODCACHE: /cache/go-mod
      RUNNERFOUNDRY_POSTGRES_CACHE: /cache/runnerfoundry/embedded-postgres
      npm_config_cache: /cache/npm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'

      - name: Lint tagged E2E code
        run: go tool github.com/golangci/golangci-lint/v2/cmd/golangci-lint run --build-tags=e2e

      - name: Vet tagged E2E code
        run: go vet -tags=e2e ./...

  sqlite-race:
    name: SQLite (race detector)
    runs-on: meza-ubuntu-slim
    timeout-minutes: 15
    needs: sqlite
    env: *ubuntu-env
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'

      - name: Run tagged SQLite E2E tests with the race detector
        env:
          E2E_BACKEND: sqlite
        run: go test -race -tags=e2e ./internal/daemon -count=1 -timeout=10m

  postgres-platform:
    name: PostgreSQL 18 (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env: *mixed-env
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: meza-windows-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false

      - name: Restore shared Windows Go cache
        shell: pwsh
        run: *restore-windows-go-cache

      - name: Cache embedded PostgreSQL 18 binaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/e2e/postgres/18.3.0
          key: embedded-postgres-v1.34.0-checksums-v1-${{ runner.os }}-${{ runner.arch }}-18.3.0

      - name: Prepare embedded PostgreSQL 18 binaries
        run: make prepare-e2e E2E_POSTGRES_VERSION=18.3.0

      - name: Run PostgreSQL 18 E2E tests offline
        run: make test-e2e E2E_BACKEND=postgres E2E_POSTGRES_VERSION=18.3.0

      - name: Save shared Windows Go cache
        if: success()
        shell: pwsh
        run: *save-windows-go-cache

  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: meza-ubuntu-slim
    needs: [postgres-platform]
    env: *ubuntu-env
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - 17.5.0
          - 18.3.0
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'

      - name: Cache embedded PostgreSQL binaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/e2e/postgres/${{ matrix.postgres }}/linux-amd64
          key: embedded-postgres-v1.34.0-checksums-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.postgres }}

      - name: Prepare embedded PostgreSQL binaries
        run: make prepare-e2e E2E_POSTGRES_VERSION=${{ matrix.postgres }}

      - name: Run PostgreSQL E2E tests offline
        run: make test-e2e E2E_BACKEND=postgres E2E_POSTGRES_VERSION=${{ matrix.postgres }}

  postgres-race:
    name: PostgreSQL 18 (focused race detector)
    runs-on: meza-ubuntu-slim
    needs: [postgres]
    env: *ubuntu-env
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'

      - name: Cache embedded PostgreSQL 18 binaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/e2e/postgres/18.3.0/linux-amd64
          key: embedded-postgres-v1.34.0-checksums-v1-${{ runner.os }}-${{ runner.arch }}-18.3.0

      - name: Prepare embedded PostgreSQL 18 binaries
        run: make prepare-e2e E2E_POSTGRES_VERSION=18.3.0

      - name: Run focused clustered E2E tests with the race detector
        env:
          E2E_BACKEND: postgres
          E2E_POSTGRES_VERSION: 18.3.0
          E2E_POSTGRES_BINARIES: ${{ github.workspace }}/build/e2e/postgres/18.3.0/linux-amd64
        run: >-
          go test -race -tags=e2e ./internal/daemon
          -run '^(TestProductContractPostgresNotificationWakesDurableQueue|TestProductContractPostgresMaintenanceRecoversMissedNotification|TestProductContractTwoMemberPostgresApplicationsFailOverWithoutLosingDemand|TestProductContractPostgresLeaderFailoverPreservesLifecycle|TestProductContractPostgresLeadershipFencesLateGitHostSession|TestProductContractHeterogeneousPostgresFollowerRestoresCommittedSourceSessionsBeforeDiscovery|TestProductContractRunnerAcceptanceWinsRecoveryRacePostgres|TestProductContractTerminalObservationWinsRecoveryRacePostgres|TestProductContractPostgresClusterReloadRecoversThenTerminatesObservedRunner)$'
          -count=1 -timeout=15m
