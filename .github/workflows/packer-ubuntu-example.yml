name: Verify Ubuntu Packer example

on:
  push:
    branches:
      - main
    paths:
      - examples/libvirt-ubuntu-runner/**
      - .github/workflows/packer-ubuntu-example.yml
  pull_request:
    paths:
      - examples/libvirt-ubuntu-runner/**
      - .github/workflows/packer-ubuntu-example.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: meza-ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: 1.15.4

      - name: Check Packer formatting
        run: packer fmt -check examples/libvirt-ubuntu-runner

      - name: Check Packer syntax
        run: packer validate -syntax-only examples/libvirt-ubuntu-runner
