name: Verify and Release

permissions:
  issues: write
  checks: write
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true


jobs:
  verify:
    runs-on: meza-ubuntu-slim
    env:
      GOCACHE: /cache/go-build
      GOMODCACHE: /cache/go-mod
      RUNNERFOUNDRY_POSTGRES_CACHE: /cache/runnerfoundry/embedded-postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Lint
        run: make lint

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Coverage
        run: make coverage

      - name: Race detection
        run: make race

  release:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: meza-macos
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25

      - name: "🧵 Install semantic release"
        run: npm i --location=global @meza/mezas-conventional-changelog semantic-release semantic-release-discord-notifier conventional-changelog-conventionalcommits @semantic-release/github @semantic-release/changelog @semantic-release/exec semantic-release-export-data semantic-release-discord

      - name: Prepare signing credentials
        shell: bash
        env:
          MACOS_SIGNING_DIR: ${{ runner.temp }}/runnerfoundry-signing-${{ github.run_id }}-${{ github.run_attempt }}
          MACOS_SIGNING_KEYCHAIN: ${{ runner.temp }}/runnerfoundry-keychain-${{ github.run_id }}-${{ github.run_attempt }}.keychain
          MACOS_APPLICATION_P12_BASE64: ${{ secrets.MACOS_APPLICATION_P12_BASE64 }}
          MACOS_APPLICATION_P12_PASSWORD: ${{ secrets.MACOS_APPLICATION_P12_PASSWORD }}
          MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
          MACOS_NOTARY_P8_BASE64: ${{ secrets.MACOS_NOTARY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf 'MACOS_SIGNING_DIR=%s\nMACOS_SIGNING_KEYCHAIN=%s\n' "$MACOS_SIGNING_DIR" "$MACOS_SIGNING_KEYCHAIN" >> "$GITHUB_ENV"
          mkdir -m 0700 "$MACOS_SIGNING_DIR"
          printf '%s' "$MACOS_APPLICATION_P12_BASE64" | base64 --decode > "$MACOS_SIGNING_DIR/application.p12"
          printf '%s' "$MACOS_INSTALLER_P12_BASE64" | base64 --decode > "$MACOS_SIGNING_DIR/installer.p12"
          printf '%s' "$MACOS_NOTARY_P8_BASE64" | base64 --decode > "$MACOS_SIGNING_DIR/notarization.p8"
          openssl pkcs12 -in "$MACOS_SIGNING_DIR/application.p12" -clcerts -nokeys -passin env:MACOS_APPLICATION_P12_PASSWORD -out "$MACOS_SIGNING_DIR/application.pem"
          openssl pkcs12 -in "$MACOS_SIGNING_DIR/installer.p12" -clcerts -nokeys -passin env:MACOS_INSTALLER_P12_PASSWORD -out "$MACOS_SIGNING_DIR/installer.pem"
          test "$(grep -c -- '-----BEGIN CERTIFICATE-----' "$MACOS_SIGNING_DIR/application.pem")" -eq 1
          test "$(grep -c -- '-----BEGIN CERTIFICATE-----' "$MACOS_SIGNING_DIR/installer.pem")" -eq 1
          application_identity="$(openssl x509 -in "$MACOS_SIGNING_DIR/application.pem" -sha1 -fingerprint -noout | cut -d= -f2 | tr -d ':')"
          installer_identity="$(openssl x509 -in "$MACOS_SIGNING_DIR/installer.pem" -noout -subject -nameopt multiline | sed -n 's/^[[:space:]]*commonName[[:space:]]*=[[:space:]]*//p')"
          printf 'MACOS_APPLICATION_IDENTITY=%s\nMACOS_INSTALLER_IDENTITY=%s\n' "$application_identity" "$installer_identity" >> "$GITHUB_ENV"

      - name: Import application certificate
        id: application-certificate
        uses: apple-actions/import-codesign-certs@77ba2a2a8f5cfc8c405ebf3159f767c323e238f9 # v7.1.0
        with:
          keychain: ${{ runner.temp }}/runnerfoundry-keychain-${{ github.run_id }}-${{ github.run_attempt }}
          p12-filepath: ${{ env.MACOS_SIGNING_DIR }}/application.p12
          p12-password: ${{ secrets.MACOS_APPLICATION_P12_PASSWORD }}

      - name: Import installer certificate
        uses: apple-actions/import-codesign-certs@77ba2a2a8f5cfc8c405ebf3159f767c323e238f9 # v7.1.0
        with:
          keychain: ${{ runner.temp }}/runnerfoundry-keychain-${{ github.run_id }}-${{ github.run_attempt }}
          create-keychain: 'false'
          keychain-password: ${{ steps.application-certificate.outputs.keychain-password }}
          p12-filepath: ${{ env.MACOS_SIGNING_DIR }}/installer.p12
          p12-password: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          APPLE_PRIVATE_KEY_PATH: ${{ env.MACOS_SIGNING_DIR }}/notarization.p8
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: npx semantic-release

      - name: Remove signing credentials
        if: always()
        shell: bash
        env:
          MACOS_SIGNING_DIR: ${{ runner.temp }}/runnerfoundry-signing-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf -- "$MACOS_SIGNING_DIR"
