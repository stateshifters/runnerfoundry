name: Verify and Release

permissions:
  issues: write
  checks: write
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true


jobs:
  release:
    runs-on: meza-ubuntu-slim
    env:
      GOCACHE: /cache/go-build
      GOMODCACHE: /cache/go-mod
      RUNNERFOUNDRY_POSTGRES_CACHE: /cache/runnerfoundry/embedded-postgres
      npm_config_cache: /cache/npm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Lint
        run: make lint

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Coverage
        run: make coverage

      - name: Race detection
        run: make race

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25

      - name: "🧵 Install semantic release"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm i --location=global @meza/mezas-conventional-changelog semantic-release semantic-release-discord-notifier conventional-changelog-conventionalcommits @semantic-release/github @semantic-release/changelog @semantic-release/exec semantic-release-export-data semantic-release-discord

      - name: Install macOS release tools
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: bash .github/scripts/install-macos-release-tools.sh

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUILL_SIGN_P12: ${{ secrets.MACOS_APPLICATION_P12_BASE64 }}
          QUILL_SIGN_PASSWORD: ${{ secrets.MACOS_APPLICATION_P12_PASSWORD }}
          MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          MACOSPKG_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
          MACOS_NOTARY_P8_BASE64: ${{ secrets.MACOS_NOTARY_P8_BASE64 }}
          APPLE_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/runnerfoundry-signing.XXXXXX")"
          trap 'rm -rf -- "$signing_dir"' EXIT
          export MACOS_INSTALLER_P12_PATH="$signing_dir/installer.p12"
          export APPLE_PRIVATE_KEY_PATH="$signing_dir/notarization.p8"
          printf '%s' "$QUILL_SIGN_P12" | base64 --decode > "$signing_dir/application-input.p12"
          openssl pkcs12 -in "$signing_dir/application-input.p12" -clcerts -out "$signing_dir/application-leaf.pem" -passin env:QUILL_SIGN_PASSWORD -passout env:QUILL_SIGN_PASSWORD
          openssl pkcs12 -export -in "$signing_dir/application-leaf.pem" -out "$signing_dir/application.p12" -passin env:QUILL_SIGN_PASSWORD -passout env:QUILL_SIGN_PASSWORD
          export QUILL_SIGN_P12="$signing_dir/application.p12"
          printf '%s' "$MACOS_INSTALLER_P12_BASE64" | base64 --decode > "$MACOS_INSTALLER_P12_PATH"
          printf '%s' "$MACOS_NOTARY_P8_BASE64" | base64 --decode > "$APPLE_PRIVATE_KEY_PATH"
          unset MACOS_INSTALLER_P12_BASE64 MACOS_NOTARY_P8_BASE64
          npx semantic-release
