name: runnerfoundry
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
section: utils
priority: optional
maintainer: Stateshifter Labs Limited <hello@stateshifterlabs.com>
description: Runner Foundry shared control plane for self-hosted ephemeral CI runners
vendor: Stateshifter Labs Limited
homepage: https://github.com/stateshifters/runnerfoundry
license: AGPL-3.0-or-later

contents:
  - src: build/linux/amd64/runnerfoundry
    dst: /usr/bin/runnerfoundry
    file_info:
      mode: 0755
  - src: packaging/systemd/runnerfoundry.service
    dst: /lib/systemd/system/runnerfoundry.service
    file_info:
      mode: 0644
  - src: packaging/config/config.yaml
    dst: /etc/runnerfoundry/config.yaml
    type: config
    file_info:
      mode: 0640
  - src: build/metadata/THIRD_PARTY_NOTICES.txt
    dst: /usr/share/doc/runnerfoundry/THIRD_PARTY_NOTICES.txt
    file_info:
      mode: 0644
  - src: build/metadata/runnerfoundry-sbom.json
    dst: /usr/share/doc/runnerfoundry/runnerfoundry-sbom.json
    file_info:
      mode: 0644
  - src: build/metadata/SOURCE.txt
    dst: /usr/share/doc/runnerfoundry/SOURCE.txt
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/runnerfoundry/LICENSE
    file_info:
      mode: 0644
  - src: COPYRIGHT
    dst: /usr/share/doc/runnerfoundry/COPYRIGHT
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh
